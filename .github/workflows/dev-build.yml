name: Dev Build

on:
  push:
    branches:
      - dev
      - feature/linux-support
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'website/**'
      - '.gitattributes'
      - '.github/**'
  pull_request:
    branches:
      - dev
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'website/**'
      - '.gitattributes'
      - '.github/**'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install

      # ── PR: upload installer as artifact for testing before merge ──────────
      - name: Build (PR test)
        if: github.event_name == 'pull_request'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --bundles nsis

      - name: Upload PR build artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: scrapstation-pr-${{ github.event.pull_request.number }}-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          retention-days: 7

      # ── Push to dev: publish dev-latest pre-release ────────────────────────
      - name: Delete existing dev-latest release
        if: github.event_name != 'pull_request'
        run: gh release delete dev-latest --yes --cleanup-tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Build and publish dev-latest pre-release
        if: github.event_name != 'pull_request'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: dev-latest
          releaseName: "Dev Build (unstable)"
          releaseBody: |
            **This is an automated dev build — not a stable release.**

            Built from the latest commit on the `dev` branch.
            Use this to test fixes before they land in a numbered release.

            Commit: ${{ github.sha }}
          releaseDraft: false
          prerelease: true
          includeUpdaterJson: false
          args: --bundles nsis

  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # For dev pushes, wait for Windows to create the release first
    needs: ${{ github.event_name != 'pull_request' && 'build-windows' || '' }}
    if: always() && (needs.build-windows.result == 'success' || github.event_name == 'pull_request')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libfuse2 \
            rpm

      - name: Install frontend dependencies
        run: pnpm install

      # ── PR: upload packages as artifact for testing before merge ──────────
      - name: Build (PR test)
        if: github.event_name == 'pull_request'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --bundles deb,rpm,appimage

      - name: Upload PR build artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: scrapstation-pr-${{ github.event.pull_request.number }}-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
          retention-days: 7

      # ── Push to dev: attach Linux packages to the dev-latest pre-release ──
      - name: Build and publish dev-latest pre-release (Linux)
        if: github.event_name != 'pull_request'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: dev-latest
          releaseName: "Dev Build (unstable)"
          releaseBody: ""
          releaseDraft: false
          prerelease: true
          includeUpdaterJson: false
          args: --bundles deb,rpm,appimage
